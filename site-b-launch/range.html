<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>The Karbonn range</title>
  <script>!function(h){h.classList.add('js');try{if(!matchMedia('(prefers-reduced-motion: reduce)').matches){h.classList.add('motion-pending');if(sessionStorage.getItem('k-nav')==='1')h.classList.add('is-arriving');setTimeout(function(){if(!h.classList.contains('has-motion'))h.classList.remove('motion-pending','is-arriving')},2500)}}catch(e){}}(document.documentElement)</script>
  <link rel="icon" href="../shared/img/brand/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../shared/fonts/fonts.css">
  <link rel="stylesheet" href="../shared/vendor/lenis.css">
  <link rel="stylesheet" href="css/site.css">
</head>
<body data-page="range">
  <header id="site-header"></header>

  <main id="main">
    <section class="page-top" data-intro>
      <div class="container">
        <span class="kicker"><span class="dot"></span>The 2026 range</span>
        <h1 data-range-title data-split style="margin-top:26px">The Karbonn <em>range</em>.</h1>
        <p>Smartphones, 4G feature phones, smart TVs and home appliances. Each one made for how India lives.</p>
        <div class="range-tabs" role="tablist" aria-label="Categories" data-range-tabs></div>
      </div>
    </section>

    <section>
      <div class="container rgrid" data-render="range"></div>
    </section>

    <section class="container">
      <div class="cta" id="notify" data-reveal="up">
        <div class="cta__img"><img src="../shared/img/zenz/duo-upright.webp" alt="ZenZ in Ice Blue and Champagne" loading="lazy"></div>
        <div class="cta__copy">
          <span class="mono" style="color:rgba(255,255,255,.75)">Launching soon</span>
          <h2 style="margin-top:16px">Be the <em>first</em> to know.</h2>
          <p>ZenZ and ZenZ Pro are almost here. Leave your email for the launch.</p>
          <form class="cta__form" data-form="notify-range">
            <div class="form-fields">
              <label class="field"><span class="sr-only">Email address</span><input class="input" type="email" name="email" placeholder="Your email address" required><span class="field__err">Enter a valid email address.</span></label>
              <button class="btn btn--black" type="submit">Notify me</button>
            </div>
            <p data-form-thanks hidden><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>You are on the list. See you at the launch.</p>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="../shared/vendor/gsap.min.js"></script>
  <script src="../shared/vendor/ScrollTrigger.min.js"></script>
  <script src="../shared/vendor/lenis.min.js"></script>
  <script src="../shared/data/icons.js"></script>
  <script src="../shared/data/logo.js"></script>
  <script src="../shared/data/products.js"></script>
  <script src="../shared/js/common.js"></script>
  <script src="../shared/js/motion.js"></script>
  <script src="js/site.js"></script>
</body>
</html>
